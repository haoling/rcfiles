### Unbind-key existing tmux key bindings (except 0-9).

# unbind
unbind-key &
unbind-key %
unbind-key "'"
unbind-key '"'
unbind-key (
unbind-key )
unbind-key .
unbind-key '~'
unbind-key D
unbind-key f
unbind-key M-n
unbind-key p
unbind-key M-p
unbind-key s
unbind-key t
unbind-key x
unbind-key C-Up
unbind-key C-Down
unbind-key C-Left
unbind-key C-Right

# Set the prefix to ^Z.
unbind-key C-b
set -g prefix ^Z
bind-key z send-prefix
bind-key ^z send-prefix

# screen ^C c 
unbind-key ^C
bind-key ^C new-window
unbind-key c
bind-key c new-window

# detach ^D d
unbind-key ^D
bind-key ^D detach

# displays * 
#unbind-key *
bind-key * choose-session

#unbind-key /
bind-key / switch-client -l

# next ^@ ^N sp n 
unbind-key Space
bind-key -r Space next-window
bind-key -r C-Space next-window

# kill K k 
unbind-key k
unbind-key K
unbind-key M-k
bind-key k confirm-before -p "kill-pane #P? (y/N)" kill-pane
bind-key K confirm-before -p "kill-window #W? (y/N)" kill-window
bind-key M-k confirm-before -p "kill-session #S? (y/N)" kill-session

# redisplay ^L l 
unbind-key ^L
bind-key ^L refresh-client
unbind-key l
bind-key l refresh-client


# :kB: focus up
unbind-key Tab
unbind-key BTab
bind-key Tab select-pane -t :.+

# ここからステータス行(最下行)の設定
## 既定の属性
# 「xxx-fg」「xxx-bg」は色、「xxx-attr」は属性
# 透明にしたい場合、端末によっては
# status-bgを「default」にすると256色パレット色の表示が部分的におかしくなる?
# 背景色は端末エミュレータの背景色に近いものを設定すると良いかも
set-option -g status-right "[#H] %H:%M"
set-option -g status-fg   default
set-option -g status-bg   colour4
set-option -g status-attr default

set-option -g status-left-fg   default
set-option -g status-left-bg   default
set-option -g status-left-attr default
set-option -g status-left-length 20

set-option -g status-right-fg   black
set-option -g status-right-bg   colour2
set-option -g status-right-attr bold

## ウィンドウ一覧部における現在非アクティブなウィンドウの項目の表示
set-window-option -g window-status-fg   white
set-window-option -g window-status-bg   default
set-window-option -g window-status-attr default

## ウィンドウ一覧部における現在アクティブなウィンドウの項目の表示
## 端末によっては256色の色を用いると正常に表示されない?
set-window-option -g window-status-current-fg   colour1
set-window-option -g window-status-current-bg   default
set-window-option -g window-status-current-attr bold

## メッセージ/プロンプト
set-option -g message-fg   colour115
set-option -g message-bg   colour24
set-option -g message-attr bright

## スクロールの右上やコピーモード選択範囲のスタイル
set-window-option -g mode-fg   colour2
set-window-option -g mode-bg   colour62
set-window-option -g mode-attr reverse,bold

## タブ番号は1から
set -g base-index 1
## 選択されているタブの末尾に*を付けない
set-window-option -g window-status-format "#I:#W"
set-window-option -g window-status-current-format "#I:#W"

set -g set-titles on
set -g set-titles-string "[#H:#S] #I:#W #T"

set-option -g update-environment LANG

set-option -g mouse on
set-option -g display-time 5000
set-option -g display-panes-time 5000
set-option -g mode-keys vi
#bind-key * choose-session
#bind-key M-* command-prompt "new-session -s %%"
unbind-key |
bind-key | split-window -h
bind-key S split-window -v
bind-key ^S split-window -v
bind-key -n M-n command-prompt "new-session -s %%"
bind-key -r M-Up resize-pane -U 1
bind-key -r M-Down resize-pane -U 1
bind-key -r M-Left resize-pane -L 1
bind-key -r M-Right resize-pane -R 1
bind-key ^\ next-layout
bind-key -n F1 select-window -t :1
bind-key -n F2 select-window -t :2
bind-key -n F3 select-window -t :3
bind-key -n F4 select-window -t :4
bind-key -n F5 select-window -t :5
bind-key -n F6 select-window -t :6
bind-key -n F7 select-window -t :7
bind-key -n F8 select-window -t :8
bind-key -n F9 select-window -t :9
#bind-key -n F12 choose-window
#bind-key -n M-KP* choose-session
bind-key -n F12 choose-session

# log output
bind-key H pipe-pane 'cat >> $HOME/logs/tmux-$(date +%Y%m%d-%H%M%S)-#S-#I.#P.log' \; display-message 'Started logging...'
bind-key h pipe-pane \; display-message 'Ended logging.'


source ${HOME}/.tmux.conf.local
